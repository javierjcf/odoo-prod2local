# =============================================================================
#  PLANTILLA DE PROYECTO · odoo-prod2local
# =============================================================================
#  Nuevo proyecto:
#      cp conf/_example.conf conf/miproyecto.conf
#      chmod 600 conf/miproyecto.conf         # el script exige estos permisos
#      $EDITOR conf/miproyecto.conf
#      ./odoo-prod2local.sh miproyecto --dry-run     # ver qué entiende el script
#      ./odoo-prod2local.sh miproyecto [--filestore]
#
#  Es un fichero bash (solo variables). Los conf/*.conf reales llevan passwords
#  y NO se suben a git; esta plantilla sí.
#
#  Estructura:
#    1. OBLIGATORIO  -> descomentado, hay que rellenarlo siempre
#    2. OPCIONAL     -> comentado con su valor POR DEFECTO; descomenta solo
#                       lo que tu proyecto cambie
# =============================================================================


# #############################################################################
#  1. OBLIGATORIO
# #############################################################################

# --- Proyecto ----------------------------------------------------------------
# Nombre del proyecto: da nombre a los backups (AAAA-MM-DD_HH-MM_<PROJECT_NAME>.tar.gz)
# y es lo que se usa para rotarlos. Solo letras, números, _ . -
PROJECT_NAME="miproyecto"

# --- Servidor remoto (SSH) ---------------------------------------------------
SSH_HOST="ejemplo.servidor.com"
SSH_USER="usuario"
# Autenticación: pon UNA de estas (ver también SSH_KEY / SSH_PASS_CMD abajo).
# Si no pones ninguna se usa el agente / claves por defecto de ssh.
SSH_PASS="password"

# --- Carpetas de docker compose (donde están prod.yaml / devel.yaml) ---------
REMOTE_DOCKER_PATH="/opt/odoo/miproyecto"      # en el servidor (prod.yaml)
LOCAL_DOCKER_PATH="/opt/odoo/miproyecto"       # en tu máquina (devel.yaml)

# --- Carpetas de backups -----------------------------------------------------
# Se crean con mkdir -p si no existen.
REMOTE_BACKUP_DIR="/home/usuario/backup-script"    # en el servidor (ruta ABSOLUTA)
LOCAL_BACKUP_DIR="$HOME/bbdd/miproyecto"           # en tu máquina

# --- Filestore (solo se usa con --filestore, pero déjalo definido) -----------
# Normalmente el filestore está en un volumen de docker:
#     /var/lib/docker/volumes/<carpeta-compose>_filestore/_data/filestore/<nombre-bbdd>/
# Poned la barra final en el origen: copia el CONTENIDO de la carpeta.
REMOTE_FILESTORE="/var/lib/docker/volumes/miproyecto_filestore/_data/filestore/prod/"
LOCAL_FILESTORE="/var/lib/docker/volumes/miproyecto_filestore/_data/filestore/devel"


# #############################################################################
#  2. OPCIONAL  (se muestra el valor por defecto)
# #############################################################################

# --- SSH: otras formas de autenticar -----------------------------------------
# Prioridad: SSH_KEY > SSH_PASS / SSH_PASS_CMD > agente / claves por defecto.
#SSH_PORT=22
#SSH_KEY=""                                  # clave privada, p.ej. "~/.ssh/id_ed25519"
#SSH_PASS_CMD=""                             # comando que imprime el password, p.ej. "pass show odoo/miproyecto"

# --- Filestore: permisos (rsync con sudo) -------------------------------------
# Los volúmenes de /var/lib/docker solo los lee/escribe root, por eso por
# defecto se usa sudo en los dos lados:
#   REMOTE_RSYNC_SUDO=true  ->  rsync --rsync-path="sudo rsync"  (el usuario SSH
#                               necesita sudo SIN password en el servidor)
#   LOCAL_RSYNC_SUDO=true   ->  sudo rsync en tu máquina (te pedirá tu password)
# Si el filestore remoto está en una carpeta normal con permisos de lectura
# (caso locotoo: /opt/odoo/filestore_v18/prod/), pon REMOTE_RSYNC_SUDO=false.
#REMOTE_RSYNC_SUDO=true
#LOCAL_RSYNC_SUDO=true

# --- Dump y restore ----------------------------------------------------------
#DUMP_FORMAT="dir"      # dir = pg_dump -Fd + pg_restore (rápido)
                        # sql = pg_dump plano + psql (como los scripts antiguos)
#DUMP_JOBS=1            # procesos paralelos del pg_dump EN PRODUCCIÓN (1 = no saturar;
                        # sube a 8 solo si el servidor lo aguanta). Solo formato dir.
#RESTORE_JOBS=4         # procesos paralelos del pg_restore en tu máquina
#COMPRESS_LEVEL=5       # compresión del pg_dump -Fd (0-9)
#PG_DUMP_OPTS=""        # opciones extra de pg_dump, p.ej. "--no-owner"
#PG_RESTORE_OPTS=""     # opciones extra de pg_restore, p.ej. "--no-owner"

# --- Rotación de backups -----------------------------------------------------
# Solo se tocan ficheros *_<PROJECT_NAME>.tar.gz.
#KEEP_LOCAL=2           # backups a conservar en tu máquina (mínimo 1)
#KEEP_REMOTE=1          # backups a conservar en el servidor
                        # (0 = borrar todos al terminar, incluido el recién creado)
#CHECK_SPACE=true       # comprobar espacio libre antes del dump (--no-space-check lo salta)

# --- Después de restaurar ----------------------------------------------------
#RUN_UPDATE=true        # click-odoo-update --update-all
#NEUTRALIZE=true        # odoo neutralize (desactiva crons, correo, etc.)
# Se ejecutan en este orden: update-all -> módulos -> scripts -> neutralize
POST_MODULES=(          # módulos a instalar (-i)
#    "web_environment_ribbon"
)
POST_SCRIPTS=(          # scripts python, ruta relativa a LOCAL_DOCKER_PATH (odoo shell)
#    "scripts/dev_set_user_passwords.py"
)

# --- Nombres de compose / base de datos --------------------------------------
#REMOTE_COMPOSE_FILE="prod.yaml"
#LOCAL_COMPOSE_FILE="devel.yaml"
#REMOTE_COMPOSE_BIN="docker compose"     # "docker-compose" en instalaciones antiguas
#LOCAL_COMPOSE_BIN="docker compose"
#REMOTE_SERVICE="odoo"                   # servicio de compose que ejecuta pg_dump
#LOCAL_SERVICE="odoo"
#REMOTE_DB="prod"                        # BBDD de origen
#LOCAL_DB="devel"                        # BBDD de destino (se borra y recrea)
