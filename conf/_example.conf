# =============================================================================
# Plantilla de proyecto para odoo-prod2local.sh
#   cp conf/_example.conf conf/miproyecto.conf && chmod 600 conf/miproyecto.conf
#   ./odoo-prod2local.sh miproyecto [--filestore]
# Es un fichero bash: solo variables. Los .conf reales NO se suben a git.
# Solo SSH_HOST, SSH_USER y las rutas son obligatorias; el resto tiene valor
# por defecto (se muestra comentado).
# =============================================================================

# --- Conexión SSH ------------------------------------------------------------
SSH_HOST="ejemplo.servidor.com"
SSH_USER="usuario"
#SSH_PORT=22
# Autenticación (elige una; si no pones ninguna usa tu agente/claves por defecto):
#SSH_KEY="~/.ssh/id_ed25519"          # clave privada
SSH_PASS=""                           # password (requiere sshpass)
#SSH_PASS_CMD="pass show odoo/miproyecto"   # o un comando que imprima el password

# --- Remoto (producción) -----------------------------------------------------
REMOTE_DOCKER_PATH="/opt/odoo/miproyecto"      # carpeta con prod.yaml
REMOTE_BACKUP_DIR="/home/usuario/backup-script" # ruta ABSOLUTA, se crea si no existe
#REMOTE_COMPOSE_BIN="docker compose"           # o "docker-compose"
#REMOTE_COMPOSE_FILE="prod.yaml"
#REMOTE_SERVICE="odoo"
#REMOTE_DB="prod"
#REMOTE_FILESTORE="/opt/odoo/filestore/prod/"   # solo si usas --filestore
#REMOTE_RSYNC_SUDO=false   # true si el filestore está en un volumen docker (root)

# --- Local (desarrollo) ------------------------------------------------------
LOCAL_DOCKER_PATH="/opt/odoo/miproyecto"       # carpeta con devel.yaml
LOCAL_BACKUP_DIR="$HOME/bbdd/miproyecto"
#LOCAL_COMPOSE_BIN="docker compose"
#LOCAL_COMPOSE_FILE="devel.yaml"
#LOCAL_SERVICE="odoo"
#LOCAL_DB="devel"
#LOCAL_FILESTORE="/var/lib/docker/volumes/miproyecto_filestore/_data/filestore/devel"
#LOCAL_RSYNC_SUDO=true

# --- Dump --------------------------------------------------------------------
#DUMP_FORMAT="dir"     # dir = pg_dump -Fd / pg_restore -j  |  sql = pg_dump plano / psql
#JOBS=8
#COMPRESS_LEVEL=5
#PG_DUMP_OPTS=""       # p.ej. "--no-owner"
#PG_RESTORE_OPTS=""    # p.ej. "--no-owner"

# --- Después de restaurar ----------------------------------------------------
#RUN_UPDATE=true       # click-odoo-update --update-all
#NEUTRALIZE=true       # odoo neutralize
POST_SCRIPTS=(         # relativos a LOCAL_DOCKER_PATH, se ejecutan con 'odoo shell'
#    "scripts/dev_set_user_passwords.py"
)
POST_MODULES=(         # se instalan con -i
#    "web_environment_ribbon"
)

# --- Rotación ----------------------------------------------------------------
#KEEP=2                # backups a conservar, en remoto y en local
#BACKUP_TAG=""         # por defecto, el nombre del proyecto
